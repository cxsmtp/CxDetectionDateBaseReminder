# Run from this folder with one command — Docker or Podman:
#   docker compose up -d        (or: podman compose up -d)
# The first start prints the administrator's sign-in:
#   docker compose logs mission-zero
services:
  mission-zero:
    build: .                      # built from this folder the first time
    image: mission-zero:local
    container_name: mission-zero
    restart: unless-stopped
    # Reachable from this machine only by default. To serve other machines, set
    # BIND_ADDRESS=0.0.0.0 (or one interface's address), ideally behind HTTPS.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - type: volume
        source: mission-zero-data
        target: /data
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]   # http or https, whichever the server serves
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Hardened: nothing in the image can be changed at run time (only /data and a
    # scratch /tmp are writable), no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Time to finish running requests and hand sign-ins to the next version on an update (docs/updating.md).
    stop_grace_period: 15s
    # Size for up to 3000 people at once (docs/performance.md): uncomment to cap
    # the container at 2 CPUs / 3 GB, and keep NODE_OPTIONS below in step.
    # cpus: 2
    # mem_limit: 3g
    environment:
      # Optional — all of these can also be set in the utility (Settings).
      HTTPS: ${HTTPS:-on}                           # on (default): HTTPS, self-signed unless TLS_CERT_FILE/TLS_KEY_FILE are given; off: plain http
      TZ: ${TZ:-UTC}                                # time zone for automatic reminders, e.g. Asia/Dubai
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}                 # first administrator's email (default admin@mission-zero.local)
      REPORT_SERVER_URL: ${REPORT_SERVER_URL:-}     # address people use to reach this server, put in every report
      CX_API_KEY: ${CX_API_KEY:-}                   # Checkmarx One integration key (or store it in Settings)
      NODE_OPTIONS: ${NODE_OPTIONS:-}               # e.g. --max-old-space-size=2048 with a 3 GB memory limit
volumes:
  mission-zero-data:
