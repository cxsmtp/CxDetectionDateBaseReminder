<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Mission Zero architecture</title>
  <desc id="d">People use the web app; Mission Zero reads findings from Checkmarx One, emails each developer their own projects through your SMTP server, and developers triage and remediate from the emailed report through Mission Zero's relay, which calls Checkmarx One AI; fixes land as pull requests. All state lives in the /data volume.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12.5px; fill: #475569; }
      .l { font-size: 12px; font-weight: 600; fill: #334155; }
      .lp { font-size: 12px; font-weight: 700; fill: #6d28d9; }
      .box { fill: #ffffff; stroke: #c4b5fd; stroke-width: 1.5; }
      .ln { stroke: #475569; stroke-width: 1.6; fill: none; }
      .lnp { stroke: #7c3aed; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="18" fill="#ffffff"/>

  <!-- People -->
  <rect x="40" y="20" width="380" height="72" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="50" text-anchor="middle" class="h">Admins · Security analysts · Users</text>
  <text x="230" y="72" text-anchor="middle" class="s">browser: Dashboard, Reports, Credits, Settings</text>

  <rect x="780" y="20" width="380" height="72" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="970" y="50" text-anchor="middle" class="h">Developers</text>
  <text x="970" y="72" text-anchor="middle" class="s">reminder email + interactive HTML report</text>

  <!-- Mission Zero container -->
  <rect x="20" y="128" width="1160" height="470" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="153" text-anchor="middle" font-size="16" font-weight="800" fill="#5b21b6">Mission Zero · one container · port 3000</text>

  <rect x="40" y="168" width="400" height="86" rx="10" class="box"/>
  <text x="240" y="192" text-anchor="middle" class="h">Web app + API</text>
  <text x="240" y="212" text-anchor="middle" class="s">Dashboard · Reports · Credits · Audit</text>
  <text x="240" y="229" text-anchor="middle" class="s">Settings · Access · Beta · Logs</text>
  <text x="240" y="246" text-anchor="middle" class="s">sign-in · roles · 29 permissions</text>

  <rect x="460" y="168" width="300" height="86" rx="10" class="box"/>
  <text x="610" y="192" text-anchor="middle" class="h">Records &amp; safety nets</text>
  <text x="610" y="212" text-anchor="middle" class="s">hash-chained audit log</text>
  <text x="610" y="229" text-anchor="middle" class="s">privacy-safe troubleshooting log</text>
  <text x="610" y="246" text-anchor="middle" class="s">last-known-good connections</text>

  <rect x="780" y="168" width="380" height="86" rx="10" class="box"/>
  <text x="970" y="192" text-anchor="middle" class="h">Report relay</text>
  <text x="970" y="212" text-anchor="middle" class="s">signed 30-day grant per finding</text>
  <text x="970" y="229" text-anchor="middle" class="s">admission control · shared cache</text>
  <text x="970" y="246" text-anchor="middle" class="s">never two sends for one vulnerability</text>

  <rect x="40" y="300" width="240" height="96" rx="10" class="box"/>
  <text x="160" y="325" text-anchor="middle" class="h">Reminders</text>
  <text x="160" y="345" text-anchor="middle" class="s">your template and branding</text>
  <text x="160" y="362" text-anchor="middle" class="s">each person: own projects only</text>
  <text x="160" y="379" text-anchor="middle" class="s">summary or one per project</text>

  <rect x="300" y="300" width="240" height="96" rx="10" class="box"/>
  <text x="420" y="325" text-anchor="middle" class="h">Fetch &amp; ageing</text>
  <text x="420" y="345" text-anchor="middle" class="s">≤ 30 · 31–60 · &gt; 60 days</text>
  <text x="420" y="362" text-anchor="middle" class="s">streamed to the page</text>
  <text x="420" y="379" text-anchor="middle" class="s">at most 24 calls at once</text>

  <rect x="560" y="300" width="200" height="96" rx="10" class="box"/>
  <text x="660" y="325" text-anchor="middle" class="h">Scheduler</text>
  <text x="660" y="345" text-anchor="middle" class="s">age-threshold automation</text>
  <text x="660" y="362" text-anchor="middle" class="s">tracked-report follow-ups</text>
  <text x="660" y="379" text-anchor="middle" class="s">backups</text>

  <rect x="780" y="300" width="380" height="96" rx="10" class="box"/>
  <text x="970" y="325" text-anchor="middle" class="h">Credits</text>
  <text x="970" y="345" text-anchor="middle" class="s">pool · per-project allocations · ledger</text>
  <text x="970" y="362" text-anchor="middle" class="s">need verified twice with Checkmarx One</text>
  <text x="970" y="379" text-anchor="middle" class="s">unused credits taken back</text>

  <!-- /data volume -->
  <path d="M560,455 a100,15 0 0 0 200,0 v100 a100,15 0 0 1 -200,0 z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <ellipse cx="660" cy="455" rx="100" ry="15" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="660" y="495" text-anchor="middle" class="h">/data volume</text>
  <text x="660" y="515" text-anchor="middle" class="s">settings · people · ledger</text>
  <text x="660" y="532" text-anchor="middle" class="s">audit log · reports · backups</text>

  <!-- External systems -->
  <rect x="40" y="640" width="240" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="676" text-anchor="middle" class="h">Your SMTP server</text>
  <text x="160" y="698" text-anchor="middle" class="s">Office 365, Gmail, relay…</text>

  <rect x="300" y="640" width="520" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="560" y="670" text-anchor="middle" class="h">Checkmarx One</text>
  <text x="560" y="692" text-anchor="middle" class="s">IAM · projects · scans · risks · results</text>
  <text x="560" y="710" text-anchor="middle" class="s">AI Triage · AI Remediation</text>

  <rect x="880" y="640" width="280" height="90" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="1020" y="676" text-anchor="middle" class="h">Your Git repositories</text>
  <text x="1020" y="698" text-anchor="middle" class="s">pull requests with the fix</text>

  <!-- Arrows: people in -->
  <line x1="330" y1="92" x2="330" y2="166" class="ln" marker-end="url(#a)"/>
  <text x="338" y="122" class="l">HTTPS</text>

  <line x1="1060" y1="92" x2="1060" y2="166" class="lnp" marker-end="url(#ap)"/>
  <text x="1052" y="122" text-anchor="end" class="lp">③ Triage / Remediate (HTTPS)</text>

  <!-- Inside -->
  <line x1="160" y1="254" x2="160" y2="298" class="ln" marker-end="url(#a)"/>
  <line x1="420" y1="254" x2="420" y2="298" class="ln" marker-end="url(#a)"/>
  <line x1="300" y1="348" x2="282" y2="348" class="ln" marker-end="url(#a)"/>
  <line x1="560" y1="348" x2="542" y2="348" class="ln" marker-end="url(#a)"/>
  <line x1="970" y1="254" x2="970" y2="298" class="lnp" marker-end="url(#ap)"/>
  <line x1="660" y1="396" x2="660" y2="438" class="ln" marker-end="url(#a)"/>
  <text x="668" y="422" class="l">state</text>

  <!-- Out -->
  <line x1="420" y1="396" x2="420" y2="638" class="ln" marker-end="url(#a)"/>
  <text x="428" y="545" class="l">① read projects,</text>
  <text x="428" y="560" class="l">scans, findings</text>

  <line x1="160" y1="396" x2="160" y2="638" class="ln" marker-end="url(#a)"/>
  <text x="168" y="545" class="l">② send</text>

  <path d="M40,685 H14 V110 H880 V94" class="ln" marker-end="url(#a)"/>
  <text x="600" y="104" text-anchor="middle" class="l">② reminder + interactive report</text>

  <path d="M970,396 V612 H760 V638" class="lnp" marker-end="url(#ap)"/>
  <text x="980" y="560" class="lp">④ AI Triage /</text>
  <text x="980" y="575" class="lp">AI Remediation</text>

  <line x1="820" y1="685" x2="878" y2="685" class="ln" marker-end="url(#a)"/>
  <text x="849" y="676" text-anchor="middle" class="l">⑤ PR</text>
</svg>
