<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CxMissionZero — deactivated</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #f5f6f8; --surface: #fff; --border: #e2e5e9; --text: #14171c; --muted: #5c636e; --accent: #2856c9; --accent-ink: #fff; --danger: #b42318; --ok: #15803d; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d0f12; --surface: #14171b; --border: #252a31; --text: #e6e8eb; --muted: #9097a1; --accent: #82a4f4; --accent-ink: #0d0f12; --danger: #f97066; --ok: #4ade80; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 26px; box-shadow: 0 12px 40px rgb(15 23 42 / 0.08); }
      .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; margin-bottom: 18px; }
      .brand img { width: 28px; height: 28px; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 14px; }
      .muted { color: var(--muted); font-size: 13.5px; }
      details { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
      summary { cursor: pointer; font-weight: 600; }
      label { display: block; margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
      textarea { width: 100%; min-height: 96px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; resize: vertical; word-break: break-all; }
      button { margin-top: 10px; min-height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 600 14px system-ui, sans-serif; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      #status { min-height: 20px; margin: 10px 0 0; font-size: 13.5px; }
      #status.error { color: var(--danger); } #status.ok { color: var(--ok); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/mz-icon-64.png" alt="" />CxMissionZero</div>
      <h1>The product has been deactivated.</h1>
      <p>Please reach out to <strong>Bhawani Singh</strong>.</p>
      <p class="muted">Nothing has been deleted: your settings, history and backups are kept, and everything works again as soon as an activation code is entered.</p>
      <details id="activate">
        <summary>Enter an activation code</summary>
        <form id="activate-form" autocomplete="off">
          <label for="code">Activation code</label>
          <textarea id="code" name="code" spellcheck="false" placeholder="MZ1.…" required></textarea>
          <button type="submit" id="submit">Activate</button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </details>
    </main>
    <script src="/deactivated.js"></script>
  </body>
</html>
