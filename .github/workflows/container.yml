name: Container image

# Builds the image on every push and pull request, smoke-tests it (starts,
# turns healthy, prints the first administrator's sign-in), and publishes it
# for linux/amd64 and linux/arm64 to the GitHub container registry from the
# default branch and version tags:
#   ghcr.io/<owner>/<repo>:latest   (and :<version>, :sha-<commit>)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t mission-zero:test .
      - name: Start, turn healthy, print the first sign-in
        run: |
          docker run -d --name mz -p 3000:3000 -v mz-data:/data -e TZ=Asia/Dubai mission-zero:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mz)" = healthy ] && break
            sleep 2
          done
          docker logs mz
          test "$(docker inspect -f '{{.State.Health.Status}}' mz)" = healthy
          docker logs mz 2>&1 | grep -q 'Password: '
          PW=$(docker logs mz 2>&1 | sed -n 's/.*Password: //p' | head -1)
          curl -sf -H 'Content-Type: application/json' \
            -d "{\"email\":\"admin@mission-zero.local\",\"password\":\"$PW\"}" \
            http://127.0.0.1:3000/api/session/password | grep -q '"signedIn":true'
          docker exec mz git --version
          docker exec mz node scripts/reset-admin.mjs | grep -q 'Password: '
          docker restart mz && sleep 5
          test "$(docker logs --since 5s mz 2>&1 | grep -c 'Password:')" = 0

  publish:
    needs: smoke-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
